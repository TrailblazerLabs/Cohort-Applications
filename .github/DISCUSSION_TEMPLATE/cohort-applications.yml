title: "[Pitch]: "
labels: ["needs upvoting"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Welcome to Trailblazer Labs!
        Submit your project pitch to apply for the next **180-day Builder in Residence** cohort[cite: 1]. The community will vote on their favorite ideas, and top submissions will be evaluated for acceptance[cite: 1].
        
        ---

  - type: textarea
    id: pitch
    attributes:
      label: 💡 Elevator Pitch
      description: What are you building? Give us a compelling 2–3 sentence summary of your asset.
      placeholder: e.g., A lightweight LWC component that connects Flow directly to Agentforce...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🎯 Problem Statement
      description: What specific process gap, architectural roadblock, or pain point does this solve?
      placeholder: Describe the manual steps or technical limitations users face today...
    validations:
      required: true

  - type: dropdown
    id: track
    attributes:
      label: 🛠️ Development Track
      description: Select the primary track that best describes your technical approach[cite: 1].
      options:
        - "The Strategist (No-Code: Prompt Libraries, Governance Models, Frameworks)"
        - "The Declarative Developer (Low-Code: Flow Templates, Agent Configs, App Builder)"
        - "The Engineer (Pro-Code: LWC, Apex, External API Integrations, CLI Plugins)"
    validations:
      required: true

  - type: textarea
    id: builder-bio
    attributes:
      label: 👤 Builder Profile
      description: Tell us briefly about yourself and your background in the Salesforce ecosystem.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 📋 Residency Terms & Guidelines
        Please review and confirm the core guidelines of the Builder in Residence program[cite: 1].

  - type: checkboxes
    id: rules-acknowledgment
    attributes:
      label: Required Acknowledgments
      options:
        - label: "Selection Process: I understand pitches are selected based on community upvotes and an internal rubric evaluating feasibility, security, and quality."
          required: true
        - label: "Production Deadline: If accepted, I agree to complete, document, and pass technical reviews on my asset before the official cohort launch."
          required: true
        - label: "Open Source Licensing: I am the original creator and agree to release this asset under the Apache 2.0 license."
          required: true
        - label: "180-Day Commitment: I agree to serve as lead maintainer for 6 months (triage issues and review PRs) before community handoff or deprecation."
          required: true
